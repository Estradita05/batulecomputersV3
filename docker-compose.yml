name: taller

services:
  db:
    image: postgres:16
    container_name: taller-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller
      TZ: America/Mexico_City
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./taller/backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./taller
      dockerfile: Dockerfile
    container_name: taller-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./taller/.env
        required: false
    environment:
      DATABASE_URL: postgresql://taller:taller@db:5432/taller
      TIMEZONE: America/Mexico_City
      UPLOAD_DIR: /app/backend/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./taller/backend/uploads:/app/backend/uploads
      - ./taller/web:/app/web

volumes:
  pgdata:
